# Streamlit settings for running the app on a remote server (e.g. Rain) and opening it
# through VS Code port forwarding or an SSH tunnel. Without these the page can stay blank.
[server]
headless = true
port = 8501
address = "localhost"        # only reachable through the forwarded port, not from the network
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
